.nav-btn:active{background:rgba(255,255,255,.25)}
.nav-title{font-family:'DM Serif Display',serif;font-size:15px;text-align:center;flex:1;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app{margin-top:52px;padding:16px 14px 180px;max-width:700px;margin-left:auto;margin-right:auto}
.tab{display:none;animation:fadeIn .3s ease}
.tab.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.welcome-box{background:var(--surface);border-radius:14px;padding:32px 24px;text-align:center;box-shadow:var(--shad);margin-top:30px}
.welcome-box h1{font-family:'DM Serif Display',serif;font-size:28px;color:var(--hdr);margin-bottom:4px}
.welcome-box .sub{font-size:18px;color:var(--acc);font-family:'DM Serif Display',serif;margin-bottom:24px}
.welcome-box input{width:100%;padding:14px 16px;border:2px solid var(--bdr);border-radius:10px;font-size:16px;font-family:inherit;text-align:center;margin-bottom:16px;user-select:text;-webkit-user-select:text}
.welcome-box input:focus{outline:none;border-color:var(--acc)}
.card{background:var(--surface);border-radius:14px;padding:22px 18px;box-shadow:var(--shad);margin-bottom:18px}
.card h2{font-family:'DM Serif Display',serif;font-size:20px;color:var(--hdr);margin-bottom:14px;border-bottom:2px solid var(--acc);padding-bottom:8px}
.card h3{font-family:'DM Serif Display',serif;font-size:17px;color:var(--accD);margin:16px 0 8px}
.card p,.card li{font-size:15px;line-height:1.7;margin-bottom:8px}
.card ol,.card ul{padding-left:20px}
.example-box{background:#faf7f2;border:1px solid var(--bdr);border-radius:10px;padding:14px;margin:12px 0;overflow-x:auto}
.katex-block{text-align:center;margin:10px 0;overflow-x:auto}
.katex-block .katex{font-size:1.15em}
.problem-text{font-size:15.5px;line-height:1.75;margin-bottom:14px}
.problem-text .katex{font-size:1.05em}
.expr-area{margin:12px 0}
.expr-area label{display:block;font-weight:600;font-size:14px;color:var(--hdr);margin-bottom:6px}
.expr-input{width:100%;padding:12px;border:2px solid var(--bdr);border-radius:10px;font-size:16px;font-family:'Courier New',monospace;resize:none;min-height:48px;user-select:text;-webkit-user-select:text;background:#fff}
.expr-input:focus{outline:none;border-color:var(--acc)}
.katex-preview{min-height:40px;padding:10px;background:#faf8f4;border-radius:8px;margin-top:6px;text-align:center;overflow-x:auto;border:1px dashed var(--bdr)}
.katex-preview .katex{font-size:1.2em}
.local-expr-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:8px 4px;margin-top:8px;background:var(--hdr);border-radius:10px}
.local-expr-bar button{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:17px;padding:10px 13px;border-radius:8px;min-width:40px;font-family:'Source Serif 4',serif;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.local-expr-bar button:active{background:var(--acc)}
.btn{display:inline-block;padding:12px 24px;border:none;border-radius:10px;font-size:15px;font-family:inherit;font-weight:600;cursor:pointer;transition:all .2s}
.btn-acc{background:var(--acc);color:#fff}
.btn-acc:active{background:var(--accD);transform:scale(.97)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:active{background:#236b3e}
.btn-blk{display:block;width:100%;text-align:center}
.save-msg{font-size:13px;color:var(--ok);margin-top:6px;min-height:18px}
.comp-q{background:#f0ece4;border-radius:10px;padding:16px;margin:18px 0 8px}
.comp-q p{font-weight:600;font-size:14.5px;margin-bottom:10px}
.comp-opt{display:block;padding:10px 14px;margin:6px 0;border:2px solid var(--bdr);border-radius:8px;font-size:14px;cursor:pointer;transition:all .15s}
.comp-opt:active,.comp-opt.sel{border-color:var(--acc);background:#fdf6ed}
.ord-inputs{display:flex;flex-direction:column;gap:10px}
.ord-field{background:#faf8f4;border-radius:10px;padding:12px;border:1px solid var(--bdr)}
.ord-field label{font-size:13px;font-weight:600;color:var(--hdr)}
#exprBar{display:none!important}
.results-card{background:var(--surface);border-radius:14px;padding:20px 14px;box-shadow:var(--shad);margin-bottom:16px;overflow-x:auto}
.results-card h2{font-family:'DM Serif Display',serif;font-size:22px;color:var(--hdr);text-align:center;margin-bottom:6px}
.grade-box{text-align:center;font-family:'DM Serif Display',serif;font-size:48px;color:var(--acc);margin:16px 0}
.grade-box small{font-size:16px;color:var(--txtM);display:block}
table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
th{background:var(--hdr);color:var(--hdrTxt);padding:8px 6px;text-align:left;font-size:12px}
td{padding:8px 6px;border-bottom:1px solid var(--bdr);vertical-align:top;word-break:break-word}
tr:nth-child(even){background:#faf8f4}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.badge-ok{background:#edf7ef;color:var(--ok)}

/* ============ SYMBOL CONVERSION ============ */
function toKatex(s){return s.replace(/×/g,'\\times ')}
function toJS(s){
  s=s.replace(/×/g,'*');
  s=s.replace(/\\times\s?/g,'*');s=s.replace(/\\cdot/g,'*');
  s=s.replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g,'(($1)/($2))');
  s=s.replace(/\s/g,'');
  s=s.replace(/\^\{([^}]*)\}/g,'**($1)');s=s.replace(/\^(\w)/g,'**$1');
  s=s.replace(/(\d)([a-zA-Z])/g,'$1*$2');
  s=s.replace(/\)\(/g,')*(');
  s=s.replace(/(\d)\(/g,'$1*(');
  s=s.replace(/\)(\d)/g,')*$1');
  return s;
}

/* ============ EXPRESSION INSERTION ============ */
var activeInput=null;
document.addEventListener("focusin",function(e){if(e.target&&e.target.classList.contains("expr-input")){activeInput=e.target}});

function insertAt(el,txt){
  if(!el)return;
  var s=el.selectionStart,end=el.selectionEnd,v=el.value;
  el.value=v.slice(0,s)+txt+v.slice(end);
  el.selectionStart=el.selectionEnd=s+txt.length;
  el.focus();
  updPrev(el);
}
function insertFrac(el){
  if(!el)return;
  var s=el.selectionStart,v=el.value;
  el.value=v.slice(0,s)+'\\frac{}{}'+v.slice(s);
  el.selectionStart=el.selectionEnd=s+6;
  el.focus();
  updPrev(el);
}
function doBk(el){
  if(!el)return;
  var s=el.selectionStart;
  if(s===0)return;
  el.value=el.value.slice(0,s-1)+el.value.slice(s);
  el.selectionStart=el.selectionEnd=s-1;
  el.focus();
  updPrev(el);
}
function doClr(el){
  if(!el)return;
  el.value='';
  el.focus();
  updPrev(el);
}

function updPrev(el){
  var pv=el.closest('.expr-area')?el.closest('.expr-area').querySelector('.katex-preview'):null;
  if(!pv)pv=el.closest('.ord-field')?el.closest('.ord-field').querySelector('.katex-preview'):null;
  if(!pv)return;
  var val=el.value.trim();
  if(!val){pv.innerHTML="<span style='color:#aaa'>Vista previa...</span>";return}
  try{katex.render(toKatex(val),pv,{throwOnError:false,displayMode:true})}
  catch(e){pv.textContent=val}
}

  var bar=btn.closest('.local-expr-bar');
  if(!bar)return;
  var container=bar.parentElement;
  if(!container)return;
  var inputEl=container.querySelector('.expr-input');
  if(!inputEl)return;
  var a=btn.getAttribute('data-a');
  if(a==='frac')insertFrac(inputEl);
  else if(a==='bk')doBk(inputEl);
  else if(a==='clr')doClr(inputEl);
  else insertAt(inputEl,a);
  setTimeout(function(){inputEl.focus()},60);
}

/* ============ VALIDATION ============ */
function evalExpr(expr,x,y){
  var js=toJS(expr);
  try{var fn=new Function('x','y','return '+js);var r=fn(x,y);return typeof r==='number'?r:NaN}
  catch(e){return NaN}
}

function exprsEq(a,b){
  var pts=[[1,1],[2,3],[0.5,2],[-1,1],[3,-2],[0.7,1.5],[4,0.3],[-0.5,-1]];
  for(var i=0;i<pts.length;i++){
    var va=evalExpr(a,pts[i][0],pts[i][1]);
    var vb=evalExpr(b,pts[i][0],pts[i][1]);
    if(isNaN(va)&&isNaN(vb))continue;
    if(isNaN(va)||isNaN(vb))return false;
    if(Math.abs(va-vb)>0.001)return false;
  }
  return true;
}

function validate(){
  var results=[],total=0,correct=0;
  for(var i=0;i<ORD.length;i++){
    var vi=S.variants['ord_'+i],v=ORD[i][vi],ans=S.answers['ord_'+i],ok=false;
    if(ans&&ans.length===4){ok=true;for(var j=0;j<4;j++){if(!exprsEq(ans[j],v.a[j])){ok=false;break}}}
    results.push({type:'Ordenamiento',num:i+1,student:ans?ans.join(', '):'Sin respuesta',expected:v.a.join(', '),ok:ok});
    total++;if(ok)correct++;
  }
  for(var i=0;i<ADDSUB.length;i++){
    var vi=S.variants['as_'+i],v=ADDSUB[i][vi],ans=S.answers['as_'+i]||'',ok=ans?exprsEq(ans,v.a):false;
    results.push({type:'Suma/Resta',num:i+1,student:ans||'Sin respuesta',expected:v.a,ok:ok});
    total++;if(ok)correct++;
  }
  for(var i=0;i<APP.length;i++){
    var vi=S.variants['app_'+i],v=APP[i][vi],ans=S.answers['app_'+i]||'',ok=ans?exprsEq(ans,v.a):false;
    results.push({type:'Aplicación',num:i+1,student:ans||'Sin respuesta',expected:v.a,ok:ok});
    total++;if(ok)correct++;
  }
  for(var i=0;i<COMP.length;i++){
    var ans=S.compAnswers[i],ok=ans===COMP[i].c;
    results.push({type:'Comprensión',num:i+1,student:ans!==undefined?COMP[i].o[ans]:'Sin respuesta',expected:COMP[i].o[COMP[i].c],ok:ok});
    total++;if(ok)correct++;
  }
  return {results:results,total:total,correct:correct,grade:total>0?Math.round(correct/total*100)/10:0};
}

function allSaved(){
  for(var i=0;i<ORD.length;i++)if(!S.answers['ord_'+i])return false;
  for(var i=0;i<ADDSUB.length;i++)if(!S.answers['as_'+i])return false;
  for(var i=0;i<APP.length;i++)if(!S.answers['app_'+i])return false;
  for(var i=0;i<COMP.length;i++)if(S.compAnswers[i]===undefined)return false;
  return true;
}

  /* ---- EVENT SUMMARY TABLE ---- */
  h+='<div class="results-card"><h2>Registro de Eventos</h2>';
  if(S.events.length===0){
    h+='<p style="color:var(--txtM)">Sin eventos registrados.</p>';
  }else{
    var evCounts={};
    for(var i=0;i<S.events.length;i++){
      var t=S.events[i].type;
      evCounts[t]=(evCounts[t]||0)+1;
    }
    var evLabels={
      'HIDDEN':'Salidas de la app / minimizar',
      'VISIBLE':'Regresos a la app',
      'BLUR':'Pérdida de foco de ventana',
      'COPY':'Intentos de copiar texto',
      'CUT':'Intentos de cortar texto',
      'PASTE':'Intentos de pegar fuera del campo',
      'PASTE_INPUT':'Pegado dentro del campo de respuesta',
      'CTX':'Menú contextual abierto (clic derecho)',
      'KEY_C':'Atajo Ctrl+C presionado',
      'KEY_V':'Atajo Ctrl+V fuera del campo',
      'KEY_X':'Atajo Ctrl+X presionado',
      'KEY_P':'Atajo Ctrl+P (imprimir) presionado',
      'KEY_S':'Atajo Ctrl+S (guardar) presionado',
      'PRTSC':'Tecla Imprimir Pantalla',
      'RESIZE':'Cambios de tamaño de ventana (pantalla dividida)',
      'NAME_SET':'Nombre registrado',
      'SAVE':'Respuestas guardadas'
    };
    h+='<table><thead><tr><th>Evento</th><th style="text-align:center;width:80px">Cantidad</th></tr></thead><tbody>';
    var evOrder=['HIDDEN','VISIBLE','BLUR','COPY','CUT','PASTE','PASTE_INPUT','CTX','KEY_C','KEY_V','KEY_X','KEY_P','KEY_S','PRTSC','RESIZE','NAME_SET','SAVE'];
    for(var i=0;i<evOrder.length;i++){
      var k=evOrder[i];
      if(evCounts[k]!==undefined){
        h+='<tr><td>'+(evLabels[k]||k)+'</td><td style="text-align:center;font-weight:700;font-size:15px;color:var(--hdr)">'+evCounts[k]+'</td></tr>';
      }
    }
    /* Any event types not in the predefined list */
    var allKeys=Object.keys(evCounts);
    for(var i=0;i<allKeys.length;i++){
      if(evOrder.indexOf(allKeys[i])===-1){
        h+='<tr><td>'+allKeys[i]+'</td><td style="text-align:center;font-weight:700;font-size:15px;color:var(--hdr)">'+evCounts[allKeys[i]]+'</td></tr>';
      }
    }
    h+='</tbody></table>';
    h+='<p style="font-size:12px;color:var(--txtM);margin-top:8px">Total de eventos registrados: <b>'+S.events.length+'</b></p>';
  }
  h+='</div>';

  h+='<div style="text-align:center;margin:20px 0"><button class="btn btn-ok" onclick="exportPDF()">Guardar PDF</button></div>';
  h+='</div>';
  return h;
}

/* ============ PDF EXPORT ============ */
function exportPDF(){
  var content=$('resultsContent');if(!content)return;
  var w=window.open('','_blank','width=800,height=600');
  if(!w){alert('Permite las ventanas emergentes para generar el PDF');return}
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Informe</title>'+
    '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">'+
    '<style>body{font-family:Georgia,serif;padding:20px;color:#2c2c2c;font-size:12px}'+
    'h2{font-size:18px;color:#1a2744;text-align:center;margin:10px 0}'+
    'h3{font-size:14px;margin:12px 0 6px}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:11px}'+
    'th{background:#1a2744;color:#e8dcc8;padding:6px 4px;text-align:left}'+
    'td{padding:5px 4px;border-bottom:1px solid #ddd;word-break:break-word}'+
    '.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700}'+
    '.badge-ok{background:#edf7ef;color:#2d8a4e}.badge-err{background:#fdecea;color:#c0392b}'+
    '.grade-box{text-align:center;font-size:36px;color:#c17f3e;margin:10px 0}'+
    '.grade-box small{font-size:12px;color:#6b6b6b;display:block}'+
    '@media print{.no-print{display:none}}</style></head><body>'+
    content.innerHTML+
    '<div class="no-print" style="text-align:center;margin:20px 0"><button onclick="window.print()" style="padding:12px 30px;font-size:14px;background:#1a2744;color:#fff;border:none;border-radius:8px;cursor:pointer">Imprimir / Guardar PDF</button></div>'+
    '</body></html>';
  w.document.write(html);w.document.close();
  setTimeout(function(){try{w.focus()}catch(e){}},300);
}

/* ============ ANTI-CHEAT ============ */
function setupAntiCheat(){
  document.addEventListener('copy',function(e){e.preventDefault();logEv('COPY','')});
  document.addEventListener('cut',function(e){e.preventDefault();logEv('CUT','')});
  document.addEventListener('paste',function(e){
    if(!e.target.classList.contains('expr-input')){e.preventDefault();logEv('PASTE','')}
    else{logEv('PASTE_INPUT','')}
  });
  document.addEventListener('contextmenu',function(e){e.preventDefault();logEv('CTX','')});
  document.addEventListener('visibilitychange',function(){logEv(document.hidden?'HIDDEN':'VISIBLE','')});
  window.addEventListener('blur',function(){logEv('BLUR','')});
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey){
      if(e.key==='c'){e.preventDefault();logEv('KEY_C','')}
      if(e.key==='v'&&!e.target.classList.contains('expr-input')){e.preventDefault();logEv('KEY_V','')}
      if(e.key==='x'){e.preventDefault();logEv('KEY_X','')}
      if(e.key==='p'){e.preventDefault();logEv('KEY_P','')}
      if(e.key==='s'){e.preventDefault();logEv('KEY_S','')}
    }
    if(e.key==='PrintScreen')logEv('PRTSC','');
  });
  var lastH=window.innerHeight;
  setInterval(function(){if(Math.abs(window.innerHeight-lastH)>200){logEv('RESIZE','');lastH=window.innerHeight}},3000);
}

/* ============ NAVIGATION ============ */
function goTo(n){
  if(n<0||n>=TABS.length)return;
  if(n===0&&S.nameLocked)return;
  if(n>0&&!S.name)return;
  S.tab=n;renderTab(n);
}
function nav(dir){var n=S.tab+dir;if(S.nameLocked&&n<1)return;goTo(n)}

/* ============ INIT ============ */
function init(){
  setupAntiCheat();
  document.addEventListener('touchstart',function(e){
    var btn=e.target.closest('.local-expr-bar button');
    if(!btn)return;
    e.preventDefault();
    handleExprBtn(btn);
  },{passive:false});
  document.addEventListener('click',function(e){
    var btn=e.target.closest('.local-expr-bar button');
    if(!btn)return;
    e.preventDefault();
    handleExprBtn(btn);
  });
  goTo(0);
}

if(typeof katex!=='undefined'){init()}
else{window.addEventListener('load',function(){setTimeout(init,200)})}
</script>
